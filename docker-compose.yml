version: '3.8'

services:
  # MySQL service
  mysql:
    image: mysql:5.7  # Changed from 8.0.43 to 5.7 for memory issues
    container_name: mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "edoRor@44"
      MYSQL_DATABASE: "crud_operations"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -pedoRor@44"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend service (Node.js + Express) - CHANGED CONTAINER NAME
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kelomi44/backend-app:latest
    container_name: backend  # ← CHANGED from backend_container to backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_HOST=mysql_container
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=edoRor@44
      - DB_DATABASE=crud_operations
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

  # Frontend service (Nginx serving static files)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: kelomi44/frontend-app:latest
    container_name: frontend_container
    restart: unless-stopped
    ports:
      - "5000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
